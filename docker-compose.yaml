version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts
    volumes:
      - /mnt/share/devops/infra/jenkins:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
    networks:
      - caddy-public
      - monitoring
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '2'
          memory: 1G
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Dhudson.security.csrf.GlobalCrumbIssuerConfiguration.DISABLE_CSRF_PROTECTION=true
    labels:
      # optional labels for Prometheus service discovery (if application metrics are needed)
      - "prometheus.scrape=true"
      - "prometheus.port=8080"
      - "prometheus.path=/prometheus"

  sonarqube:
    image: sonarqube:community
    depends_on:
      - postgres
    volumes:
      - /mnt/share/devops/infra/sonarqube:/opt/sonarqube/data
      - /mnt/share/devops/infra/sonarqube/extensions:/opt/sonarqube/extensions
      - /mnt/share/devops/infra/sonarqube/logs:/opt/sonarqube/logs
    networks:
      - caddy-public
      - monitoring
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '2'
          memory: 1G
    environment:
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=${SONAR_DB_PASSWORD}
      - SONAR_JDBC_URL=jdbc:postgresql://postgres:5432/sonar
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true

  postgres:
    image: postgres:15-alpine
    volumes:
      - /mnt/share/devops/infra/postgres:/var/lib/postgresql/data
    networks:
      - caddy-public
      - monitoring
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '2'
          memory: 1G
    environment:
      - POSTGRES_USER=${SONAR_DB_USER}
      - POSTGRES_PASSWORD=${SONAR_DB_PASSWORD}
      - POSTGRES_DB=sonar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 5

  nexus:
    image: sonatype/nexus3:latest
    volumes:
      - /mnt/share/devops/infra/nexus:/nexus-data
    networks:
      - caddy-public
      - monitoring
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Xms1200M -XX:MaxDirectMemorySize=2G -Djava.utils.prefs.userRoot=/nexus-data/javaprefs
      - NEXUS_CONTEXT=/

networks:
  caddy-public:
    external: true
  monitoring:
    driver: overlay
    attachable: true
    internal: false
